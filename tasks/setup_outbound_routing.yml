---
- name: Prepare Reserved IP outbound routing facts
  ansible.builtin.import_tasks: prepare_outbound_routing.yml

- name: Switch Ansible management to the Reserved IP
  ansible.builtin.import_tasks: switch_ansible_to_reserved_ip.yml
  when:
    - can_retrieve_anchor_gateway_associated_to_this_droplet
    - anchor_gateway_associated_to_droplet is defined
    - anchor_gateway_associated_to_droplet | length > 0
    - do_droplet_reserved_ip_address is defined
    - do_droplet_reserved_ip_address | length > 0

- name: Apply immediate Debian-family routing through the Reserved IP
  ansible.builtin.import_tasks: apply_immediate_routing.yml
  when:
    - can_retrieve_anchor_gateway_associated_to_this_droplet
    - anchor_gateway_associated_to_droplet is defined
    - anchor_gateway_associated_to_droplet | length > 0
    - do_droplet_reserved_ip_address is defined
    - do_droplet_reserved_ip_address | length > 0
    - ansible_facts['os_family'] != 'RedHat'

- name: Persist Debian-family routing through netplan
  ansible.builtin.import_tasks: apply_netplan_routing.yml
  when:
    - can_retrieve_anchor_gateway_associated_to_this_droplet
    - anchor_gateway_associated_to_droplet is defined
    - ansible_facts['os_family'] in ['Debian']

- name: Persist RedHat-family routing through NetworkManager
  ansible.builtin.import_tasks: apply_networkmanager_routing.yml
  when:
    - can_retrieve_anchor_gateway_associated_to_this_droplet
    - anchor_gateway_associated_to_droplet is defined
    - ansible_facts['os_family'] in ['RedHat']

- name: Report Reserved IP outbound routing configuration
  ansible.builtin.import_tasks: report_outbound_routing.yml
  when:
    - can_retrieve_anchor_gateway_associated_to_this_droplet
    - anchor_gateway_associated_to_droplet is defined
    - anchor_gateway_associated_to_droplet | length > 0
