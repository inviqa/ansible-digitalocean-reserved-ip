---
- name: Check if the DigitalOcean droplet exists
  ansible.builtin.uri:
    url: >-
      {{ digitalocean_reserved_ip_api_base_url }}/droplets/{{ digitalocean_reserved_ip_droplet_id }}
    headers:
      Content-Type: 'application/json'
      Authorization: "Bearer {{ digitalocean_reserved_ip_api_token }}"
    body_format: json
    method: GET
    follow_redirects: all
    return_content: true
    timeout: 60
  delegate_to: localhost
  register: do_droplet_check_json_response
  no_log: true
