---
- name: Check if the requested Reserved IP exists
  ansible.builtin.uri:
    url: "{{ digitalocean_reserved_ip_api_base_url }}/reserved_ips/{{ digitalocean_reserved_ip_effective_address }}"
    headers:
      Content-Type: 'application/json'
      Authorization: "Bearer {{ digitalocean_reserved_ip_api_token }}"
    body_format: json
    method: GET
    status_code:
      - 200
    follow_redirects: all
    return_content: true
    timeout: 60
  delegate_to: localhost
  register: do_reserved_ip_json_response
  no_log: true

- name: Initialize Reserved IP assignment facts
  ansible.builtin.set_fact:
    reserved_ip_is_assigned: "{{ do_reserved_ip_json_response.json.reserved_ip.droplet is not none }}"
    do_droplet_reserved_ip_address: "{{ do_reserved_ip_json_response.json.reserved_ip.ip }}"
    droplet_id_associated_to_reserved_ip: ""
    reserved_ip_is_assigned_to_this_droplet: false
    can_retrieve_anchor_ip_associated_to_this_droplet: false
    can_retrieve_anchor_gateway_associated_to_this_droplet: false

- name: Store the droplet currently associated with the Reserved IP
  ansible.builtin.set_fact:
    droplet_id_associated_to_reserved_ip: "{{ do_reserved_ip_json_response.json.reserved_ip.droplet.id }}"
  when: reserved_ip_is_assigned

- name: Mark the Reserved IP as already attached to this droplet
  ansible.builtin.set_fact:
    reserved_ip_is_assigned_to_this_droplet: true
  when: droplet_id_associated_to_reserved_ip | string == digitalocean_reserved_ip_droplet_id | string

- name: Assign the Reserved IP to the requested droplet
  digitalocean.cloud.reserved_ip_assign:
    token: "{{ digitalocean_reserved_ip_api_token }}"
    reserved_ip: "{{ digitalocean_reserved_ip_effective_address }}"
    droplet_id: "{{ digitalocean_reserved_ip_droplet_id | int }}"
    timeout: 300
  delegate_to: localhost
  register: do_reserved_ip_assign_action_json_response
  no_log: true
  when: not reserved_ip_is_assigned_to_this_droplet

- name: Store assigned Reserved IP response facts
  ansible.builtin.set_fact:
    do_droplet_reserved_ip_address: "{{ do_reserved_ip_assign_action_json_response.reserved_ip.ip }}"
  when:
    - do_reserved_ip_assign_action_json_response is defined
    - do_reserved_ip_assign_action_json_response.reserved_ip is defined
    - do_reserved_ip_assign_action_json_response.reserved_ip.ip is defined

- name: Mark the Reserved IP as attached after assignment
  ansible.builtin.set_fact:
    reserved_ip_is_assigned_to_this_droplet: true
  when: not reserved_ip_is_assigned_to_this_droplet
