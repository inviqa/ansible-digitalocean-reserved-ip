---
- name: Check whether a DigitalOcean API token is available
  ansible.builtin.assert:
    that:
      - enc_do_v2_api_key | length > 0
    fail_msg: >-
      Set do_test_api_token in tests/test_variables.yml or export
      DIGITAL_OCEAN_API_TOKEN before running the
      {{
        digitalocean_reserved_ip_test_credential_context
        | default('live test harness')
      }}.

- name: Validate the DigitalOcean API token
  ansible.builtin.uri:
    url: https://api.digitalocean.com/v2/account
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ enc_do_v2_api_key }}"
    method: GET
    status_code:
      - 200
      - 401
    return_content: true
    timeout: 60
  delegate_to: localhost
  register: do_test_account_auth_check
  no_log: true
  failed_when: false

- name: Check whether the DigitalOcean API token can authenticate
  ansible.builtin.assert:
    that:
      - do_test_account_auth_check.status == 200
    fail_msg: >-
      The configured DigitalOcean token could not authenticate against the
      DigitalOcean API. Update do_test_api_token in tests/test_variables.yml or
      export a valid DIGITAL_OCEAN_API_TOKEN before running the
      {{
        digitalocean_reserved_ip_test_credential_context
        | default('live test harness')
      }}.
