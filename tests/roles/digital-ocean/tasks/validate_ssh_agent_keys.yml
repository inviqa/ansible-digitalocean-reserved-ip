---
- name: List local SSH agent public keys
  ansible.builtin.command: ssh-add -L
  delegate_to: localhost
  register: digitalocean_reserved_ip_test_ssh_agent_public_keys
  changed_when: false
  failed_when: false
  no_log: true

- name: Resolve local SSH agent MD5 fingerprints
  ansible.builtin.command: ssh-keygen -E md5 -lf -
  args:
    stdin: "{{ item }}"
  delegate_to: localhost
  loop: "{{ digitalocean_reserved_ip_test_ssh_agent_public_keys.stdout_lines | default([]) }}"
  register: digitalocean_reserved_ip_test_ssh_agent_md5_fingerprints
  changed_when: false
  no_log: true
  when: digitalocean_reserved_ip_test_ssh_agent_public_keys.rc == 0

- name: Store selected DigitalOcean SSH key fingerprint values
  ansible.builtin.set_fact:
    digitalocean_reserved_ip_test_do_ssh_key_fingerprint_values: "{{ digitalocean_reserved_ip_test_resolved_ssh_keys }}"
  delegate_to: localhost
  no_log: true

- name: Validate selected DigitalOcean SSH key is loaded in the SSH agent
  ansible.builtin.assert:
    that:
      - digitalocean_reserved_ip_test_ssh_agent_public_keys.rc == 0
      - >-
        (
          digitalocean_reserved_ip_test_ssh_agent_md5_fingerprints.results
          | default([])
          | map(attribute='stdout')
          | join('\n')
          | regex_search(digitalocean_reserved_ip_test_do_ssh_key_fingerprint_values | join('|'))
        ) is not none
    fail_msg: >-
      The selected DigitalOcean SSH key is not loaded in the forwarded SSH
      agent. Load the matching private key with ssh-add, choose a DigitalOcean
      key that is already in the agent, or set do_ssh_private_key_file for
      manual playbook runs.
  delegate_to: localhost
