---
- name: Ensure test SSH keys are configured
  ansible.builtin.assert:
    that:
      - digital_ocean_ssh_keys | length > 0
    fail_msg: >-
      Set do_ssh_keys in tests/test_variables.yml to one or more DigitalOcean
      SSH key IDs, fingerprints, or names before running the test harness.
  delegate_to: localhost

- name: Normalize DigitalOcean SSH key selectors
  ansible.builtin.set_fact:
    digitalocean_reserved_ip_test_ssh_key_selectors: >-
      {{
        digitalocean_reserved_ip_test_ssh_key_selectors | default([])
        + [digitalocean_reserved_ip_test_ssh_key_selector]
      }}
  loop: "{{ digital_ocean_ssh_keys }}"
  vars:
    digitalocean_reserved_ip_test_ssh_key_selector: >-
      {{
        item
        | string
        | trim
        | regex_replace('^-\\s*', '')
        | trim
        | regex_replace('^"', '')
        | regex_replace('"$', '')
        | regex_replace("^'", '')
        | regex_replace("'$", '')
      }}
  when: digitalocean_reserved_ip_test_ssh_key_selector | length > 0
  delegate_to: localhost
  no_log: true

- name: Gather DigitalOcean SSH keys
  digitalocean.cloud.ssh_keys_info:
    token: "{{ digital_ocean_api_token }}"
  delegate_to: localhost
  register: digitalocean_reserved_ip_test_do_ssh_keys
  no_log: true

- name: Resolve DigitalOcean SSH key selectors
  ansible.builtin.set_fact:
    digitalocean_reserved_ip_test_resolved_ssh_keys: >-
      {{
        digitalocean_reserved_ip_test_resolved_ssh_keys | default([])
        + [item.fingerprint]
      }}
    digitalocean_reserved_ip_test_resolved_ssh_key_public_keys: >-
      {{
        digitalocean_reserved_ip_test_resolved_ssh_key_public_keys | default([])
        + [item.public_key]
      }}
  loop: "{{ digitalocean_reserved_ip_test_do_ssh_keys.ssh_keys }}"
  delegate_to: localhost
  no_log: true
  when: >-
    (item.id | string) in digitalocean_reserved_ip_test_ssh_key_selectors
    or item.fingerprint in digitalocean_reserved_ip_test_ssh_key_selectors
    or item.name in digitalocean_reserved_ip_test_ssh_key_selectors

- name: Validate DigitalOcean SSH key selectors
  ansible.builtin.assert:
    that:
      - digitalocean_reserved_ip_test_resolved_ssh_keys is defined
      - >-
        digitalocean_reserved_ip_test_resolved_ssh_keys | length
        == digitalocean_reserved_ip_test_ssh_key_selectors | length
      - >-
        digitalocean_reserved_ip_test_resolved_ssh_key_public_keys | length
        == digitalocean_reserved_ip_test_ssh_key_selectors | length
    fail_msg: >-
      One or more do_ssh_keys entries were not found in DigitalOcean as an ID,
      fingerprint, or name.
  delegate_to: localhost
