---

- name: Prepare DigitalOcean test prerequisites
  hosts: digital_ocean
  connection: local
  gather_facts: false
  serial: 1
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_connection: local
  pre_tasks:
    - name: Load local test overrides
      ansible.builtin.include_tasks: tasks/load_local_test_overrides.yml

    - name: Prefer Workspace DigitalOcean SSH key selectors
      ansible.builtin.set_fact:
        do_ssh_keys: "{{ digitalocean_reserved_ip_test_do_ssh_keys_from_env }}"
      when: digitalocean_reserved_ip_test_do_ssh_keys_from_env | length > 0
      no_log: true

    - name: Validate DigitalOcean test credentials
      ansible.builtin.include_tasks: tasks/validate_digitalocean_credentials.yml
      vars:
        digitalocean_reserved_ip_test_credential_context: live test harness
  roles:
    - { role: digital-ocean }

- name: Install Python on test droplets
  hosts: digital_ocean
  gather_facts: false
  tasks:
    - name: Install Python for Ansible requirements
      ansible.builtin.import_tasks: tasks/install_python.yml

- name: Manage Reserved IPs on test droplets
  hosts: digital_ocean
  roles:
    - { role: inviqa_digitalocean_reserved_ip }

- name: Validate Reserved IP test results
  hosts: digital_ocean
  tasks:
    - name: Run validation tasks
      ansible.builtin.include_tasks: tasks/test_tasks.yml
