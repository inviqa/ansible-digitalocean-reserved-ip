---

- name: Clean up DigitalOcean live test resources
  hosts: digital_ocean
  gather_facts: false
  vars_files:
    - ../defaults/main.yml
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_connection: local
    hostname: "ansible-digitalocean-reserved-ip-{{ inventory_hostname }}"
    do_test_resource_names:
      - "{{ hostname }}"
      - "{{ inventory_hostname }}-test-with-ansible"
    do_test_tag: "ANSIBLE-TEST"
  pre_tasks:
    - name: Load local test overrides
      ansible.builtin.include_tasks: tasks/load_local_test_overrides.yml

    - name: Validate DigitalOcean cleanup credentials
      ansible.builtin.include_tasks: tasks/validate_digitalocean_credentials.yml
      vars:
        digitalocean_reserved_ip_test_credential_context: cleanup playbook
  tasks:
    - name: Delete test resources
      ansible.builtin.include_tasks: tasks/delete_test_resources.yml
