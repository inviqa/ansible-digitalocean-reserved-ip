---
digitalocean_reserved_ip_api_base_url: >-
  {{ digital_ocean_api_base_url | default('https://api.digitalocean.com/v2') }}
digitalocean_reserved_ip_metadata_anchor_ipv4_url: >-
  {{
    digital_ocean_metadata_anchor_ipv4_url
    | default('http://169.254.169.254/metadata/v1/interfaces/public/0/anchor_ipv4/address')
  }}
digitalocean_reserved_ip_metadata_anchor_ipv4_gateway_url: >-
  {{
    digital_ocean_metadata_anchor_ipv4_gateway_url
    | default('http://169.254.169.254/metadata/v1/interfaces/public/0/anchor_ipv4/gateway')
  }}
digitalocean_reserved_ip_metadata_reserved_ip_active_url: >-
  {{
    digital_ocean_metadata_reserved_ip_active_url
    | default('http://169.254.169.254/metadata/v1/reserved_ip/ipv4/active')
  }}
digitalocean_reserved_ip_metadata_reserved_ip_address_url: >-
  {{
    digital_ocean_metadata_reserved_ip_address_url
    | default('http://169.254.169.254/metadata/v1/reserved_ip/ipv4/ip_address')
  }}
digitalocean_reserved_ip_metadata_public_ipv4_gateway_url: >-
  {{
    digital_ocean_metadata_public_ipv4_gateway_url
    | default('http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/gateway')
  }}
digitalocean_reserved_ip_api_token: >-
  {{ digital_ocean_api_token | default(enc_do_v2_api_key) }}
digitalocean_reserved_ip_droplet_id: >-
  {{ digital_ocean_droplet_id | default(do.droplet.id) | mandatory }}
digitalocean_reserved_ip_address: "{{ digital_ocean_reserved_ip | default('') }}"
digitalocean_reserved_ip_enable_outbound_routing: >-
  {{ enable_reserved_ip_outbound_routing | default(true) }}
